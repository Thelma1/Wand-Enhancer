name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer
          path: WandEnhancer/bin/Release/
          if-no-files-found: error
          retention-days: 7
